# Nginx reverse-proxy for the Khata API
# Place in /etc/nginx/sites-available/khata-api and symlink to sites-enabled

upstream khata_api {
    server 127.0.0.1:4000;
    keepalive 64;
}

server {
    listen 80;
    server_name api.khata.example.com;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.khata.example.com;

    # ── TLS (Let's Encrypt / certbot) ──
    ssl_certificate     /etc/letsencrypt/live/api.khata.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.khata.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security headers ──
    add_header X-Frame-Options        "DENY"         always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "no-referrer"  always;

    # ── Rate limiting ──
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req zone=api burst=60 nodelay;

    # ── Body size (bill photo uploads) ──
    client_max_body_size 10M;

    # ── Gzip ──
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    location / {
        proxy_pass         http://khata_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check (no auth needed)
    location = /health {
        proxy_pass http://khata_api/health;
        access_log off;
    }
}
